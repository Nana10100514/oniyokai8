<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>おにと、おさんぽ。</title><link rel="stylesheet" href="style.css"></head><body><video id="camera" autoplay muted playsinline hidden></video><main><section class="stage"><canvas id="view" aria-label="鬼と撮影するカメラ"></canvas><div id="welcome" style="display:none"><button id="start">カメラを開く</button></div><span class="hint">タップで移動 · 2本指で拡大縮小</span><span id="timer" hidden>● 00:00</span></section><div id="status" role="status" aria-live="polite"></div><section class="controls"><div class="modes"><button class="active" data-mode="photo">写真</button><button data-mode="video">動画</button></div><div class="shutter-row"><button id="flip" class="round" aria-label="内・外カメラ切替">↻</button><button id="shutter" aria-label="写真を撮る"><span></span></button><button id="motion" class="round" aria-label="動きを止める">Ⅱ</button></div><div hidden><input id="size" type="range" min="20" max="100" value="80"><input id="speed" type="range" min="70" max="300" value="170"></div></section></main><dialog id="result"><div class="result-head"><h2>プレビュー</h2><button id="close" class="round" aria-label="閉じる">×</button></div><div id="media"></div><p></p><button id="share">共有・保存</button><a id="download" download>ダウンロード ↓</a></dialog><script src="yokai.js"></script><script src="app.js"></script></body></html>
